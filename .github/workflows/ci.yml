name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # rustup (preinstalled on the runner) reads rust-toolchain.toml and
      # installs the pinned channel plus rustfmt/clippy on first use
      - name: Sync toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # release binaries, built only when main advances (all deps are pure Rust
  # thanks to rustls + fancy-regex, so cross-arch darwin builds need no SDK fuss)
  build:
    name: build (${{ matrix.target }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Sync toolchain
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # tar from a staged <target>/ folder so the archive unpacks to
      # <target>/suspenders with the executable bit intact (artifact zips
      # strip permissions; tar keeps them)
      - name: Stage
        run: |
          mkdir -p stage/${{ matrix.target }} dist
          cp target/${{ matrix.target }}/release/suspenders stage/${{ matrix.target }}/
          tar -czf dist/suspenders-${{ matrix.target }}.tar.gz -C stage ${{ matrix.target }}

      - uses: actions/upload-artifact@v6
        with:
          name: suspenders-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  # fold the per-target artifacts into one download holding the three
  # suspenders-<target>.tar.gz archives
  package:
    name: package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v6
        with:
          name: suspenders
          pattern: suspenders-*
          delete-merged: true
