name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # rustup (preinstalled on the runner) reads rust-toolchain.toml and
      # installs the pinned channel plus rustfmt/clippy on first use
      - name: Sync toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      # prebuilt binary, no compile cost
      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo nextest run

      # nextest doesn't run doctests; keep them covered for the lib target
      - name: Doctest
        run: cargo test --doc

  # line coverage via tarpaulin (config in .tarpaulin.toml); runs alongside ci
  # since coverage instrumentation forces a full rebuild either way
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sync toolchain
        run: rustup show active-toolchain

      # coverage RUSTFLAGS produce different artifacts than the test job,
      # so keep a separate cache keyspace
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      # prebuilt binary, no compile cost
      - name: Install tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Coverage
        run: cargo tarpaulin

      - uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: target/tarpaulin
          if-no-files-found: error

      # no prebuilt binaries published, so cargo-install the pinned version
      # (the crate ships a Cargo.lock, so --locked stays reproducible)
      - name: Install rustqual
        run: cargo install rustqual --version 1.8.2 --locked

      # quality gate: fails if any of the seven dimensions regress against the
      # committed baseline OR the aggregate quality score drops below the floor
      # (see rustqual.toml). --no-fail suppresses rustqual's default
      # findings-present exit so only regression + floor decide the gate; runs
      # after the artifact upload so the coverage report survives a red gate
      - name: rustqual quality gate
        run: rustqual . --coverage target/tarpaulin/lcov.info --compare rustqual-baseline.json --fail-on-regression --min-quality-score 80 --no-fail

  # release binaries, built only when main advances (all deps are pure Rust
  # thanks to rustls + fancy-regex, so cross-arch darwin builds need no SDK fuss)
  build:
    name: build (${{ matrix.target }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Sync toolchain
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # tar from a staged <target>/ folder so the archive unpacks to
      # <target>/suspenders with the executable bit intact (artifact zips
      # strip permissions; tar keeps them)
      - name: Stage
        run: |
          mkdir -p stage/${{ matrix.target }} dist
          cp target/${{ matrix.target }}/release/suspenders stage/${{ matrix.target }}/
          tar -czf dist/suspenders-${{ matrix.target }}.tar.gz -C stage ${{ matrix.target }}

      - uses: actions/upload-artifact@v6
        with:
          name: suspenders-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  # fold the per-target artifacts into one download holding the three
  # suspenders-<target>.tar.gz archives
  package:
    name: package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v6
        with:
          name: suspenders
          pattern: suspenders-*
          delete-merged: true
