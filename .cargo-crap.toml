# cargo-crap config (CRAP = cyclomatic^2 x (1 - coverage)^3 + cyclomatic).
# Coverage comes from cargo-tarpaulin (see .tarpaulin.toml). The gate is
# regression-only against the committed baseline (the pre-existing fold
# roots with CC > 30 can never pass an absolute threshold, by design of
# the formula):
#   cargo tarpaulin
#   cargo crap --lcov target/tarpaulin/lcov.info --baseline .cargo-crap-baseline.json --fail-regression
# Refresh the baseline after a deliberate score change:
#   cargo crap --lcov target/tarpaulin/lcov.info --format json --output .cargo-crap-baseline.json

# baseline diffs stay minimal when entries are ordered by file, not score
sort = "file"

exclude = [
  # vendored tuning fixture crates, not production code
  "docs/**",
  # test-only code: tarpaulin's ignore-tests means it never has coverage
  # data, so it would all score as untested
  "src/**/tests.rs",
  "src/**/fixtures.rs",
  "src/test_support.rs",
]
