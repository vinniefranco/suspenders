[package]
name = "suspenders"
version = "0.1.0"
edition = "2024"

[dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# TUI (confined to the `ui` module - ADR-0001, ADR-0019).
# unstable-rendered-line-info: `Paragraph::line_count(width)` gives the exact
# wrap-aware line total from the SAME wrapping code that draws, which the
# bottom-anchored viewport (ui::viewport) needs to follow the tail.
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
# display-column widths for the diff render path (ui::components only, ADR-0008):
# a wide CJK/emoji glyph counts 2 columns, so a tinted diff row stays exactly
# `content_width` columns and the viewport never re-wraps it. Pinned to the same
# 0.2 ratatui already resolves, so no extra copy is pulled.
unicode-width = "0.2"
# fuzzy `/` command palette ranking (ADR-0051, System B): pure-Rust fzf-v2-parity
# matcher, confined to ui::completion. Returns only a score + match indices, so
# no matcher type leaks past the pure core (ADR-0019); a prefix fallback covers
# the empty-pattern / matcher-error paths.
nucleo-matcher = "0.3"

# LLM boundary: Anthropic wire protocol over SSE (ADR-0002)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
async-trait = "0.1" # only the object-safe `Llm` trait needs this; TurnDeps stays static-dispatch (ADR-0011)

# markdown → semantic terminal lines (ui::markdown is the pure fold; colors stay in ui::components, ADR-0008)
pulldown-cmark = { version = "0.12", default-features = false }
# Human-friendly formatting
thousands = "0.2.0"
# code-fence syntax highlighting at render time (ui::components only, ADR-0008);
# "default-fancy" = pure-Rust fancy-regex engine + bundled syntaxes/themes, no onig C dep
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# serde-tagged domain model + JSONL Session Log (ADR-0010)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# user theme files are TOML (ADR-0038); config.json stays serde_json
toml = "0.8"

# CLI + config seam (Session::new)
clap = { version = "4", features = ["derive"] }

# errors
thiserror = "2"
anyhow = "1"

# tools & platform
nix = { version = "0.29", features = ["signal", "process"] } # killpg for run_command (ADR-0023)
html2text = "0.12"                                           # web_fetch HTML → readable text (ADR-0024)
regex = "1"                                                  # grep, edit_file fuzzy matching
directories = "5"                                            # XDG session_dir default
time = { version = "0.3", features = ["formatting", "macros"] } # Session Log UTC filenames

# The Catalog data generator (ADR-0037): `cargo run --bin generate-models`
# rewrites the committed src/llm/catalog/data/*.json from models.dev.
[[bin]]
name = "generate-models"
path = "src/bin/generate_models.rs"

# The diff-render demo (ADR-0008): `cargo run --bin diff-demo` renders a seeded
# Screen of `Diff` items through the real frame path so the tint + syntect
# highlighting can be eyeballed live, no Agent/Session/IO.
[[bin]]
name = "diff-demo"
path = "src/bin/diff_demo.rs"

[dev-dependencies]
wiremock = "0.6"       # canned-SSE transport tests (ADR-0002)
tempfile = "3"         # tmp-dir Project Root in tool tests
assert_matches = "1.5" # event-ordering assertions (ADR-0021)
