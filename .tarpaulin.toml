# cargo-tarpaulin config (picked up automatically by `cargo tarpaulin`)
[default]
# llvm instrumentation is faster and more accurate than the ptrace default
engine = "Llvm"
# tests live under /tests, wired into their modules as `#[cfg(test)] #[path=...]
# mod tests;`; don't count that test code as lines to cover
ignore-tests = true
out = ["Lcov", "Html"]
output-dir = "target/tarpaulin"
