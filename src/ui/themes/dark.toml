# The built-in dark theme (ADR-0038): today's palette, stated in full.
# This is the fallback floor every sparse theme resolves over, so every slot
# is present. ANSI names stay names - they draw from the user's terminal
# palette; hex values are the exact RGB the app has always used.

syntax = "base16-ocean.dark"

[colors]
# The conversation plane.
added = "green"
removed = "red"
# Subtle full-width diff tints (ADR-0008): low-luminance green/red that
# composite over the dark ground without fighting the syntect foreground, in
# the same dark register as code_block_bg="#191923".
added_bg = "#12291b"
removed_bg = "#331a1d"
context = "dark_gray"
muted = "dark_gray"
machinery = "dark_gray"
error = "red"
# The qwen QwenDark text + status roles (Phase 7, ADR-0008): body foreground,
# the purple accent (user `>` / assistant `✦`), the green success, the gold
# warning - stated as the designed QwenDark hexes.
foreground = "#bfbdb6"
accent = "#D2A6FF"
success = "#AAD94C"
warning = "#FFD700"
thinking = "dark_gray"
thinking_header = "dark_gray"
lull = "#cba6f7"
prompt_gutter = "cyan"
lane_spine = "dark_gray"

# The tinted marker plane (ADR-0040): the harness voice, one tint per tone.
# Housekeeping is the muted gray; Aid is a warm amber (clear of error-red),
# Constrain a calm blue (clear of success-green).
marker_housekeeping = "dark_gray"
marker_aid = "#d7a75f"
marker_constrain = "#6a9fd4"

# Assistant markdown.
heading = "cyan"
bullet = "cyan"
quote = "dark_gray"
link = "blue"
code = "yellow"
code_block = "#b9d7b4"
code_block_bg = "#191923"

# Chrome.
popup_border = "cyan"
